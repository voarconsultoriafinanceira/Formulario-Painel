<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Respostas · Lucas Mello</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060706; --panel:rgba(255,255,255,.035); --panel-strong:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.05);
  --text:#f2f4f1; --muted:#98a29a; --muted-2:#6d766f;
  --mint:#3fe3a1; --emerald:#0f9e6e; --glow:rgba(63,227,161,.35);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh;position:relative;}
h1,h2,h3,.display{font-family:'Sora',system-ui,sans-serif;}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(var(--line-soft) 1px,transparent 1px),linear-gradient(90deg,var(--line-soft) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(ellipse 80% 50% at 50% 0%,#000 40%,transparent 90%);opacity:.5;pointer-events:none;z-index:0;}
body::after{content:"";position:fixed;width:60vw;height:60vw;right:-15vw;bottom:-25vw;background:radial-gradient(circle,var(--glow),transparent 65%);filter:blur(10px);opacity:.35;pointer-events:none;z-index:0;}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:28px 20px 60px;}
.header{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
.avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--line);}
.header .who b{font-size:15px;display:block;}
.header .who span{font-size:12.5px;color:var(--muted);}
h1{font-size:26px;margin:22px 0 4px;font-weight:700;letter-spacing:-.01em;}
.subtitle{color:var(--muted);font-size:14px;margin:0 0 26px;}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:28px;}
.stat-card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px 18px;}
.stat-card .num{font-family:'Sora';font-size:26px;font-weight:700;color:var(--mint);}
.stat-card .lbl{font-size:12px;color:var(--muted);margin-top:4px;}
.toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;color:var(--text);font-family:inherit;font-size:13.5px;outline:none;}
.search:focus{border-color:var(--mint);}
.btn{border:none;border-radius:12px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;background:var(--panel);color:var(--muted);border:1px solid var(--line);}
.btn:hover{border-color:var(--mint);color:var(--text);}
.btn-primary{background:linear-gradient(135deg,var(--mint),var(--emerald));color:#04140c;border:none;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
.table-wrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);}
th{text-align:left;padding:13px 16px;color:var(--muted-2);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line);}
td{padding:14px 16px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
tr:last-child td{border-bottom:none;}
tr.row-item{cursor:pointer;transition:background .12s;}
tr.row-item:hover{background:var(--panel-strong);}
.name-cell b{display:block;font-size:14px;}
.name-cell span{color:var(--muted-2);font-size:12px;}
.empty{padding:60px 20px;text-align:center;color:var(--muted);}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:8px;font-family:'Sora';}
/* modal / detail */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:20;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 16px;}
.overlay.open{display:flex;}
.detail{max-width:720px;width:100%;background:#0b0d0c;border:1px solid var(--line);border-radius:20px;padding:26px;position:relative;}
.detail-close{position:absolute;top:18px;right:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;width:32px;height:32px;color:var(--muted);cursor:pointer;font-size:15px;}
.detail h2{font-size:21px;margin:0 0 4px;padding-right:40px;}
.detail .meta{color:var(--muted);font-size:13px;margin-bottom:20px;}
.section{margin-bottom:22px;}
.section-title{font-size:13px;font-weight:700;color:var(--mint);text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.section-title::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--mint);}
.qa{border-bottom:1px solid var(--line-soft);padding:10px 0;}
.qa:last-child{border-bottom:none;}
.qa .q{font-size:12.5px;color:var(--muted);margin-bottom:4px;}
.qa .a{font-size:14px;line-height:1.5;}
.qa .a.empty-a{color:var(--muted-2);font-style:italic;}
.list-chip{display:inline-block;background:rgba(63,227,161,.1);border:1px solid rgba(63,227,161,.25);color:var(--mint);border-radius:8px;padding:2px 9px;font-size:12px;margin:2px 4px 2px 0;}
.mini-item{border:1px solid var(--line-soft);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px;}
.flag{display:inline-flex;align-items:center;gap:6px;background:rgba(239,106,106,.1);border:1px solid rgba(239,106,106,.3);color:#ef8a8a;border-radius:8px;padding:4px 10px;font-size:12px;margin-bottom:10px;}
.loading{text-align:center;padding:60px;color:var(--muted);}
</style>
</head>

const CONFIG = {
  APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbzGOnUNsf5G8zB6L0GHMB6jADSQ6v6-JGaLwMIiSm9bFnSyhGwj6_qBHfTPk2JGP4Lw/exec'

let allSubmissions = []; // full detail cache {summary + answers}
let indexSummaries = [];

// O código de acesso fica salvo só neste navegador (localStorage),
// nunca fica escrito no arquivo HTML público.
function getToken(){
  let t = localStorage.getItem('admin_token');
  if(!t){
    t = (prompt('Digite o código de acesso do painel:') || '').trim();
    if(t) localStorage.setItem('admin_token', t);
  }
  return t;
}

async function loadIndex(){
  const token = getToken();
  if(!token){ indexSummaries = []; return; }
  try{
    const url = `${CONFIG.APPS_SCRIPT_URL}?action=list&token=${encodeURIComponent(token)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.ok){
      indexSummaries = data.submissions;
    } else {
      indexSummaries = [];
      if(data.error === 'unauthorized'){
        localStorage.removeItem('admin_token');
        alert('Código de acesso inválido. Tente novamente.');
      }
    }
  }catch(e){ indexSummaries = []; }
}

async function loadFull(id){
  const token = localStorage.getItem('admin_token');
  try{
    const url = `${CONFIG.APPS_SCRIPT_URL}?action=get&id=${encodeURIComponent(id)}&token=${encodeURIComponent(token)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.ok) return data.submission;
  }catch(e){ console.warn('erro ao carregar', id, e); }
  return null;
}

function renderStats(){
  const host = document.getElementById('stats');
  const total = indexSummaries.length;
  const today = new Date().toDateString();
  const todayCount = indexSummaries.filter(s=>new Date(s.createdAt).toDateString()===today).length;
  const cities = new Set(indexSummaries.map(s=>s.cidade).filter(Boolean)).size;
  host.innerHTML = `
    <div class="stat-card"><div class="num">${total}</div><div class="lbl">Respostas recebidas</div></div>
    <div class="stat-card"><div class="num">${todayCount}</div><div class="lbl">Hoje</div></div>
    <div class="stat-card"><div class="num">${cities}</div><div class="lbl">Cidades diferentes</div></div>
  `;
}

function renderList(filterTerm=''){
  const host = document.getElementById('list-host');
  let items = [...indexSummaries].sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  if(filterTerm){
    const t = filterTerm.toLowerCase();
    items = items.filter(s => (s.nome||'').toLowerCase().includes(t) || (s.email||'').toLowerCase().includes(t) || (s.cidade||'').toLowerCase().includes(t));
  }
  if(items.length===0){
    host.innerHTML = `<div class="table-wrap"><div class="empty"><b>Nenhuma resposta ainda</b>Assim que um cliente concluir o formulário de onboarding, a resposta aparece aqui automaticamente.</div></div>`;
    return;
  }
  host.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Cliente</th><th>Cidade</th><th>Recebido em</th></tr></thead>
    <tbody>
      ${items.map(s=>`
        <tr class="row-item" data-id="${s.id}">
          <td class="name-cell"><b>${escapeHtml(s.nome||'(sem nome)')}</b><span>${escapeHtml(s.email||'')}</span></td>
          <td>${escapeHtml(s.cidade||'—')}</td>
          <td>${formatDate(s.createdAt)}</td>
        </tr>`).join('')}
    </tbody>
  </table></div>`;
  host.querySelectorAll('.row-item').forEach(row=>{
    row.addEventListener('click', ()=>openDetail(row.dataset.id));
  });
}

function formatDate(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ return iso; }
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fmtAnswer(key, val){
  if(val===undefined || val===null || val==='' ) return null;
  if(key==='patrimonio_itens' || key==='obj_curto' || key==='obj_medio' || key==='obj_longo'){
    if(!Array.isArray(val) || val.length===0) return null;
    return val.map(item => `<div class="mini-item">${Object.entries(item).filter(([k,v])=>v).map(([k,v])=>`<b>${escapeHtml(String(v))}</b>`).join(' · ')}</div>`).join('');
  }
  if(Array.isArray(val)){
    if(val.length===0) return null;
    return val.map(v=>`<span class="list-chip">${escapeHtml(v)}</span>`).join('');
  }
  if(val===true) return '<span class="list-chip">Confirmado ✓</span>';
  if(val===false) return null;
  return escapeHtml(String(val));
}

async function openDetail(id){
  const overlay = document.getElementById('overlay');
  const detail = document.getElementById('detail');
  detail.innerHTML = `<div class="loading">Carregando resposta...</div>`;
  overlay.classList.add('open');
  const full = await loadFull(id);
  if(!full){
    detail.innerHTML = `<button class="detail-close" id="close-detail">✕</button><div class="loading">Não foi possível carregar esta resposta.</div>`;
    document.getElementById('close-detail').onclick = ()=>overlay.classList.remove('open');
    return;
  }
  const a = full.answers || {};
  const flags = [];
  if(a.reserva_possui==='Não') flags.push('Sem reserva de emergência');
  if(a.org_rotativo==='Sim') flags.push('Usa rotativo/cheque especial com frequência');
  if(a.conf_rentabilidade==='conversar') flags.push('Quer conversar sobre garantia de rentabilidade na reunião');
  if(a.conf_risco==='duvida') flags.push('Ainda tem dúvidas sobre risco');

  let sectionsHtml = SECTIONS.map(sec=>{
    const rows = sec.keys.map(k=>{
      const formatted = fmtAnswer(k, a[k]);
      if(formatted===null) return '';
      const label = (sec.labels && sec.labels[k]) || LABEL_OVERRIDES[k] || k;
      return `<div class="qa"><div class="q">${label}</div><div class="a">${formatted}</div></div>`;
    }).join('');
    if(!rows) return '';
    return `<div class="section"><div class="section-title">${sec.title}</div>${rows}</div>`;
  }).join('');

  detail.innerHTML = `
    <button class="detail-close" id="close-detail">✕</button>
    <h2>${escapeHtml(full.nome||'(sem nome)')}</h2>
    <div class="meta">${escapeHtml(full.email||'')} · recebido em ${formatDate(full.createdAt)}</div>
    ${flags.map(f=>`<div class="flag">⚠ ${f}</div>`).join('')}
    ${sectionsHtml}
  `;
  document.getElementById('close-detail').onclick = ()=>overlay.classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') e.currentTarget.classList.remove('open');
});

document.getElementById('search').addEventListener('input', e=>renderList(e.target.value));
document.getElementById('btn-refresh').addEventListener('click', async ()=>{
  await loadIndex();
  renderStats();
  renderList(document.getElementById('search').value);
});

(async function init(){
  document.getElementById('list-host').innerHTML = `<div class="table-wrap"><div class="loading">Carregando respostas...</div></div>`;
  await loadIndex();
  renderStats();
  renderList();
})();
